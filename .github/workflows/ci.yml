name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check installer syntax
        run: sh -n scripts/install.sh

      - name: Check installer style
        run: shellcheck --shell=sh scripts/install.sh

      - name: Build container
        run: docker build --tag refract:ci .
