name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/refract-linux-${GOARCH}" \
            ./cmd/gateway

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: refract-linux-${{ matrix.goarch }}
          path: dist/refract-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: refract-linux-*
          path: release
          merge-multiple: true

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bundle="Refract-${version}"
          chmod 755 release/refract-linux-*
          mkdir -p "package/${bundle}/dist"
          git archive HEAD | tar -x -C "package/${bundle}"
          cp release/refract-linux-* "package/${bundle}/dist/"
          tar -czf "release/${bundle}-linux.tar.gz" -C package "${bundle}"
          cd release
          sha256sum refract-linux-* "${bundle}-linux.tar.gz" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --title "Refract ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
