<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>首次安装 | Refract</title>
  <link rel="icon" href="/_gateway/avatar">
  <link rel="stylesheet" href="/_admin/assets/app.css?v=1.15.0-20260817-2">
  <script defer src="/_admin/assets/lucide.min.js"></script>
  <script defer src="/_admin/assets/setup.js?v=1.15.0-20260817-2"></script>
</head>
<body class="login-page setup-page">
  <main class="login-shell">
    <section class="login-frame" aria-labelledby="setup-title">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true"><img src="/_gateway/avatar" alt=""></span>
        <div>
          <strong>Refract</strong>
          <span>管理控制台</span>
        </div>
      </div>
      <div class="login-heading">
        <span class="eyebrow"><i data-lucide="sparkles"></i>首次安装</span>
        <h1 id="setup-title">创建管理员</h1>
        <p><span class="status-dot"></span>完成后即可进入控制台</p>
      </div>
      <form id="setup-form" novalidate>
        <label for="setup-username">用户名</label>
        <input id="setup-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64">
        <label for="setup-password">密码</label>
        <input id="setup-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <label for="setup-confirm-password">确认密码</label>
        <input id="setup-confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <p class="setup-hint">密码长度至少 12 个字符。管理员创建后，Turnstile 可在设置页配置。</p>
        <p id="setup-error" class="form-error" role="alert" hidden></p>
        <button id="setup-button" class="primary-button" type="submit"><i data-lucide="user-round-plus"></i><span>完成安装</span></button>
      </form>
      <footer><i data-lucide="shield-check"></i><span>初始化仅允许创建一个管理员</span></footer>
    </section>
  </main>
</body>
</html>
