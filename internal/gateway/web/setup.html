<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>首次安装 | Refract</title>
  <link rel="icon" href="/_gateway/avatar">
  <link rel="stylesheet" href="/_admin/assets/app.css?v=3.3.11">
  <script defer src="/_admin/assets/lucide.min.js"></script>
  <script defer src="/_admin/assets/setup.js?v=3.3.15"></script>
</head>
<body class="auth-page">
  <div class="grid-backdrop" aria-hidden="true"></div>
  <header class="auth-topbar">
    <a class="auth-back" href="/"><i data-lucide="arrow-left"></i><span>返回网关状态页</span></a>
    <button id="auth-theme-toggle" class="icon-btn bordered" type="button" aria-label="切换深色模式" title="切换深色模式">
      <i data-lucide="moon"></i>
    </button>
  </header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="setup-title">
      <div class="auth-brand">
        <span class="brand-avatar" aria-hidden="true"><img src="/_gateway/avatar" alt=""></span>
        <div class="auth-brand-text">
          <strong>Refract</strong>
          <span>反向代理管理控制台</span>
        </div>
      </div>
      <div class="auth-header">
        <span class="badge badge-accent"><i data-lucide="sparkles"></i>首次初始化</span>
        <h1 id="setup-title">创建管理员账号</h1>
        <p><span class="status-dot pulse"></span>完成后将自动登录进入管理控制台</p>
      </div>
      <form id="setup-form" class="auth-form" method="post" novalidate>
        <div class="field">
          <label class="field-label" for="setup-username">管理员用户名</label>
          <input id="setup-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" value="admin" placeholder="admin">
        </div>
        <div id="setup-token-field" class="field" hidden>
          <label class="field-label" for="setup-token">初始化令牌（ADMIN_SETUP_TOKEN）</label>
          <input id="setup-token" name="setup_token" type="password" autocomplete="off" spellcheck="false" placeholder="请输入服务器配置的 ADMIN_SETUP_TOKEN">
        </div>
        <div class="field">
          <label class="field-label" for="setup-password">登录密码</label>
          <div class="password-wrap">
            <input id="setup-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="72" placeholder="至少 12 个字符（不超过 72 字节）">
            <button id="toggle-setup-password" class="icon-btn" type="button" aria-label="显示密码" title="显示密码">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="setup-confirm-password">确认登录密码</label>
          <input id="setup-confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="72" placeholder="再次输入密码">
        </div>
        <div class="password-checks">
          <div id="check-length" class="password-check"><i data-lucide="circle"></i><span>密码至少 12 个字符且不超过 72 字节</span></div>
          <div id="check-match" class="password-check"><i data-lucide="circle"></i><span>两次输入的密码保持一致</span></div>
        </div>
        <p id="setup-error" class="field-error" role="alert" hidden></p>
        <button id="setup-button" class="btn btn-primary btn-block btn-lg" type="submit">
          <i data-lucide="user-round-plus"></i><span>完成初始化并进入控制台</span>
        </button>
      </form>
      <div class="auth-card-footer">
        <i data-lucide="shield-check"></i><span>仅允许初始化一个管理员；人机验证可在后台设置中开启</span>
      </div>
    </section>
  </main>
  <footer class="auth-page-footer">Refract · Modern Edge Reverse Proxy Platform</footer>
</body>
</html>
