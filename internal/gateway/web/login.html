<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理员登录 | Refract</title>
  <link rel="icon" href="/_gateway/avatar">
  <link rel="stylesheet" href="/_admin/assets/app.css?v=3.3.11">
  <script defer src="/_admin/assets/lucide.min.js"></script>
  <script defer src="/_admin/assets/login.js?v=3.3.15"></script>
</head>
<body class="auth-page">
  <div class="grid-backdrop" aria-hidden="true"></div>
  <header class="auth-topbar">
    <a class="auth-back" href="/"><i data-lucide="arrow-left"></i><span>返回网关状态页</span></a>
    <button id="auth-theme-toggle" class="icon-btn bordered" type="button" aria-label="切换深色模式" title="切换深色模式">
      <i data-lucide="moon"></i>
    </button>
  </header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-brand">
        <span class="brand-avatar" aria-hidden="true"><img src="/_gateway/avatar" alt=""></span>
        <div class="auth-brand-text">
          <strong>Refract</strong>
          <span>反向代理管理控制台</span>
        </div>
      </div>
      <div class="auth-header">
        <h1 id="login-title">管理员登录</h1>
        <p><span class="status-dot pulse"></span>网关服务在线，请输入凭据继续</p>
      </div>
      <form id="login-form" class="auth-form" method="post" novalidate>
        <div class="field">
          <label class="field-label" for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" placeholder="admin">
        </div>
        <div class="field">
          <label class="field-label" for="password">密码</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入管理员密码">
            <button id="toggle-password" class="icon-btn" type="button" aria-label="显示密码" title="显示密码">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div id="login-turnstile" class="turnstile-box" hidden>
          <p class="turnstile-label"><i data-lucide="shield-check"></i><span>完成安全验证后继续</span></p>
          <div id="login-turnstile-widget"></div>
        </div>
        <p id="login-error" class="field-error" role="alert" hidden></p>
        <button id="login-button" class="btn btn-primary btn-block btn-lg" type="submit">
          <i data-lucide="log-in"></i><span>登录控制台</span>
        </button>
      </form>
      <div class="auth-card-footer">
        <i data-lucide="shield-check"></i><span>已启用防爆破保护与 HttpOnly 会话隔离</span>
      </div>
    </section>
  </main>
  <footer class="auth-page-footer">Refract · Modern Edge Reverse Proxy Platform</footer>
</body>
</html>
